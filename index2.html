<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مرتب‌ساز مسیر پخش بسته</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: Tahoma, sans-serif; background: #f0f4f8; margin: 0; padding: 15px; color: #222; }
  h1 { font-size: 20px; text-align: center; color: #1a5490; }
  .card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  label { font-weight: bold; display: block; margin-bottom: 8px; }
  textarea { width: 100%; height: 180px; padding: 10px; border: 2px solid #cbd5e0; border-radius: 8px; font-family: Tahoma, sans-serif; font-size: 14px; resize: vertical; direction: rtl; }
  button { width: 100%; padding: 14px; margin-top: 10px; background: #1a5490; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
  button:disabled { background: #94a3b8; }
  button.green { background: #16a34a; }
  button.gray { background: #64748b; }
  button.blue { background: #0ea5e9; }
  button.purple { background: #7c3aed; }
  .status { text-align: center; padding: 10px; font-size: 14px; color: #555; }
  .result-item { background: #f8fafc; border-right: 4px solid #1a5490; padding: 12px; margin-bottom: 8px; border-radius: 6px; display: flex; align-items: center; gap: 10px; }
  .num { background: #1a5490; color: white; min-width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; flex-shrink: 0; }
  .addr { font-size: 14px; line-height: 1.6; word-break: break-word; flex: 1; }
  .gmap-btn { background: #4285f4; padding: 8px 12px; margin: 0; font-size: 12px; width: auto; white-space: nowrap; }
  .hidden { display: none; }
  .play-mode { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #f0f4f8; z-index: 9999; padding: 20px; overflow-y: auto; }
  .play-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .play-header h2 { margin: 0; font-size: 18px; color: #1a5490; }
  .exit-btn { background: #ef4444; padding: 10px 16px; width: auto; margin: 0; font-size: 14px; }
  .counter-badge { background: #1a5490; color: white; padding: 6px 14px; border-radius: 20px; font-size: 14px; font-weight: bold; }
  .play-card { background: white; border-radius: 16px; padding: 25px; text-align: center; box-shadow: 0 4px 16px rgba(0,0,0,0.1); }
  .play-num { font-size: 60px; font-weight: bold; color: #1a5490; line-height: 1; }
  .play-label { font-size: 14px; color: #888; margin-top: 8px; }
  .play-addr { font-size: 18px; margin-top: 25px; line-height: 2; padding: 20px; background: #f0f9ff; border-radius: 10px; border: 2px dashed #0ea5e9; min-height: 100px; }
  .play-actions { margin-top: 25px; display: flex; gap: 10px; }
  .play-actions button { flex: 1; padding: 18px; font-size: 16px; }
  .nav-big { background: #4285f4; }
  .next-big { background: #16a34a; }
  .finish-msg { text-align: center; padding: 40px 20px; }
  .finish-msg .emoji { font-size: 80px; }
  .finish-msg .title { font-size: 24px; font-weight: bold; color: #16a34a; margin-top: 20px; }
</style>
</head>
<body>

<div id="mainApp">
  <h1>🚚 مرتب‌ساز مسیر پخش بسته</h1>

  <div class="card">
    <label>📍 مبدأ (انبار):</label>
    <div style="background:#e8f4ff;padding:10px;border-radius:6px;font-size:13px;margin-bottom:15px;">
      نقطه مبادله امانت پستی پیام، کرج
    </div>

    <label>📝 آدرس‌ها رو وارد کن (هر خط یه آدرس):</label>
    <textarea id="addresses" placeholder="کرج، عظیمیه، میدان اسبی&#10;کرج، گوهردشت، سه راه&#10;..."></textarea>

    <button id="btnFast" onclick="sortAddresses('fast')">⚡ مرتب‌سازی سریع</button>
    <button id="btnAccurate" onclick="sortAddresses('accurate')">🎯 مرتب‌سازی دقیق (کندتر)</button>
    <div class="status" id="status"></div>
  </div>

  <div class="card hidden" id="resultCard">
    <label>✅ ترتیب بهینه:</label>
    <div id="results" style="margin-top:15px;"></div>
    <button class="green" onclick="startPlayMode()">🚀 شروع پخش</button>
    <button class="gray" onclick="downloadCSV()">📥 دانلود CSV</button>
  </div>
</div>

<div id="playMode" class="play-mode hidden">
  <div class="play-header">
    <h2>🚚 حالت پخش</h2>
    <button class="exit-btn" onclick="exitPlayMode()">✕ خروج</button>
  </div>
  <div style="text-align:center;margin-bottom:15px;">
    <span class="counter-badge" id="playCounter">1 از 0</span>
  </div>
  <div id="playContent">
    <div class="play-card">
      <div class="play-num" id="playNum">1</div>
      <div class="play-label">آدرس فعلی</div>
      <div class="play-addr" id="playAddr">-</div>
      <div class="play-actions">
        <button class="nav-big" onclick="openGoogleMaps()">🧭 ناوبری</button>
        <button class="next-big" onclick="nextAddress()">بعدی ←</button>
      </div>
    </div>
  </div>
  <div id="playFinish" class="finish-msg hidden">
    <div class="emoji">🎉</div>
    <div class="title">همه آدرس‌ها تموم شد!</div>
    <button class="green" onclick="exitPlayMode()" style="margin-top:30px;">بازگشت</button>
  </div>
</div>

<script>
const GEO_KEY = "service.a5b2efdc8b074529ab57d17d5c8d14b5";
const ORIGIN_ADDRESS = "نقطه مبادله امانت پستی پیام، کرج";

let sortedResults = [];
let sortedPoints = [];
let playIndex = 0;

async function geocode(address) {
  const url = `https://api.neshan.org/v4/geocoding?address=${encodeURIComponent(address)}`;
  const res = await fetch(url, { headers: { "Api-Key": GEO_KEY } });
  if (!res.ok) throw new Error(`Geocoding failed: ${res.status}`);
  const data = await res.json();
  return { lat: data.location.y, lng: data.location.x };
}

// فاصله خط مستقیم
function haversine(p1, p2) {
  const R = 6371;
  const dLat = (p2.lat - p1.lat) * Math.PI / 180;
  const dLng = (p2.lng - p1.lng) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(p1.lat*Math.PI/180)*Math.cos(p2.lat*Math.PI/180)*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// ماتریس فاصله محلی
function buildLocalMatrix(points) {
  const n = points.length;
  const m = [];
  for (let i=0;i<n;i++){ m[i]=[]; for (let j=0;j<n;j++) m[i][j]=haversine(points[i],points[j]); }
  return m;
}

// ماتریس فاصله واقعی از نشان
async function buildNeshanMatrix(points) {
  const url = "https://api.neshan.org/v4/distance-matrix";
  const body = {
    origins: points.map(p => ({ lat: p.lat, lng: p.lng })),
    destinations: points.map(p => ({ lat: p.lat, lng: p.lng }))
  };
  const res = await fetch(url, {
    method: "POST",
    headers: { "Api-Key": GEO_KEY, "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  if (!res.ok) throw new Error(`Distance Matrix failed: ${res.status}`);
  const data = await res.json();
  // تبدیل به ماتریس فاصله
  const n = points.length;
  const m = [];
  for (let i=0;i<n;i++) {
    m[i] = [];
    for (let j=0;j<n;j++) {
      m[i][j] = data.rows[i].elements[j].distance.value / 1000; // متر به کیلومتر
    }
  }
  return m;
}

// الگوریتم Nearest Neighbor
function nearestNeighbor(matrix, n) {
  const visited = new Array(n).fill(false);
  const order = [0]; visited[0] = true;
  for (let i=1;i<n;i++){
    const last = order[order.length-1];
    let nearest=-1, minD=Infinity;
    for (let j=0;j<n;j++){
      if (!visited[j] && matrix[last][j] < minD) { minD = matrix[last][j]; nearest = j; }
    }
    if (nearest===-1) break;
    order.push(nearest); visited[nearest]=true;
  }
  return order;
}

async function sortAddresses(mode) {
  const btnFast = document.getElementById("btnFast");
  const btnAcc = document.getElementById("btnAccurate");
  const status = document.getElementById("status");
  const textarea = document.getElementById("addresses").value.trim();

  if (!textarea) { alert("آدرس‌ها رو وارد کن!"); return; }
  const addresses = textarea.split("\n").map(a=>a.trim()).filter(a=>a);
  if (addresses.length < 2) { alert("حداقل ۲ تا آدرس!"); return; }

  btnFast.disabled = true;
  btnAcc.disabled = true;

  try {
    status.textContent = "📍 پیدا کردن انبار...";
    const originPoint = await geocode(ORIGIN_ADDRESS);

    status.textContent = `📍 پیدا کردن ${addresses.length} آدرس...`;
    const points = [originPoint];
    const valid = [];
    for (let i=0;i<addresses.length;i++){
      status.textContent = `📍 آدرس ${i+1} از ${addresses.length}...`;
      try {
        const p = await geocode(addresses[i]);
        points.push(p); valid.push(addresses[i]);
      } catch(e) { console.warn("پیدا نشد:", addresses[i]); }
    }
    if (points.length < 2) throw new Error("هیچ آدرسی پیدا نشد!");

    let matrix;
    if (mode === 'accurate') {
      status.textContent = "📊 محاسبه فاصله واقعی جاده‌ها (ممکنه طول بکشه)...";
      try {
        matrix = await buildNeshanMatrix(points);
      } catch(e) {
        console.warn("Distance Matrix خطا داد، می‌ریم سراغ روش سریع");
        status.textContent = "⚠️ روش دقیق خطا داد، از روش سریع استفاده می‌کنیم...";
        matrix = buildLocalMatrix(points);
      }
    } else {
      status.textContent = "📊 محاسبه فاصله (سریع)...";
      matrix = buildLocalMatrix(points);
    }

    status.textContent = "🔄 مرتب‌سازی...";
    const order = nearestNeighbor(matrix, points.length);

    sortedResults = [];
    sortedPoints = [];
    order.slice(1).forEach(idx => {
      sortedResults.push(valid[idx-1]);
      sortedPoints.push(points[idx]);
    });

    const resultsDiv = document.getElementById("results");
    resultsDiv.innerHTML = "";
    sortedResults.forEach((addr, i) => {
      const div = document.createElement("div");
      div.className = "result-item";
      div.innerHTML = `
        <div class="num">${i+1}</div>
        <div class="addr">${addr}</div>
        <button class="gmap-btn" onclick="openGoogleMapsFor(${i})">🗺️</button>`;
      resultsDiv.appendChild(div);
    });

    document.getElementById("resultCard").classList.remove("hidden");
    const modeName = mode === 'accurate' ? 'دقیق' : 'سریع';
    status.textContent = `✅ ${sortedResults.length} آدرس (روش ${modeName}) مرتب شد!`;
  } catch(e) {
    status.textContent = "❌ خطا: " + e.message;
    console.error(e);
  } finally {
    btnFast.disabled = false;
    btnAcc.disabled = false;
  }
}

function openGoogleMapsFor(index) {
  const p = sortedPoints[index];
  window.open(`https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}&travelmode=driving`, '_blank');
}

function startPlayMode() {
  if (sortedResults.length === 0) return;
  playIndex = 0;
  document.getElementById("mainApp").classList.add("hidden");
  document.getElementById("playMode").classList.remove("hidden");
  document.getElementById("playFinish").classList.add("hidden");
  document.getElementById("playContent").classList.remove("hidden");
  updatePlayView();
}

function updatePlayView() {
  if (playIndex >= sortedResults.length) {
    document.getElementById("playContent").classList.add("hidden");
    document.getElementById("playFinish").classList.remove("hidden");
    return;
  }
  document.getElementById("playNum").textContent = (playIndex + 1);
  document.getElementById("playCounter").textContent = `${playIndex + 1} از ${sortedResults.length}`;
  document.getElementById("playAddr").textContent = sortedResults[playIndex];
}

function openGoogleMaps() {
  if (playIndex >= sortedResults.length) return;
  const p = sortedPoints[playIndex];
  window.open(`https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}&travelmode=driving`, '_blank');
}

function nextAddress() {
  playIndex++;
  updatePlayView();
  if (playIndex < sortedResults.length) {
    setTimeout(() => {
      const p = sortedPoints[playIndex];
      window.open(`https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}&travelmode=driving`, '_blank');
    }, 300);
  }
}

function exitPlayMode() {
  document.getElementById("playMode").classList.add("hidden");
  document.getElementById("mainApp").classList.remove("hidden");
}

function downloadCSV() {
  let csv = "order,address,lat,lng\n";
  sortedResults.forEach((addr, i) => {
    csv += `${i+1},"${addr.replace(/"/g,'""')}",${sortedPoints[i].lat},${sortedPoints[i].lng}\n`;
  });
  const blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `route-${new Date().toISOString().slice(0,10)}.csv`; a.click();
  URL.revokeObjectURL(url);
}
</script>

</body>
</html>
